<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SnapVault — Image Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0c0e;
  --s1:#111114;
  --s2:#17171b;
  --s3:#1e1e24;
  --border:#26262e;
  --border2:#32323c;
  --text:#f0eee8;
  --muted:#6e6e80;
  --soft:#9898aa;
  --cream:#e8e0d0;
  --rose:#e8604c;
  --teal:#4ecdc4;
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

nav{
  background:rgba(12,12,14,.95);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:0 40px;height:64px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50;
}
.brand{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:var(--cream);letter-spacing:.5px;display:flex;align-items:center;gap:10px;}
.brand-line{width:28px;height:1px;background:var(--rose);}
.nav-right{display:flex;align-items:center;gap:12px;}
.nav-tag{font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:1.2px;}

.btn{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:8px;padding:10px 18px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;text-decoration:none;white-space:nowrap;}
.btn-rose{background:var(--rose);color:#fff;}.btn-rose:hover{background:#d4543f;transform:translateY(-1px);}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--soft);}.btn-ghost:hover{border-color:var(--rose);color:var(--rose);}
.btn-sm{padding:6px 13px;font-size:12px;border-radius:7px;}

main{max-width:1200px;margin:0 auto;padding:40px 24px;}

.stats{display:flex;gap:16px;margin-bottom:36px;flex-wrap:wrap;}
.stat{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:20px 24px;display:flex;align-items:center;gap:14px;min-width:180px;animation:rise .5s ease both;}
.stat:nth-child(2){animation-delay:.07s}
.sico{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:rgba(232,96,76,.1);border:1px solid rgba(232,96,76,.2);}
.sico2{background:rgba(78,205,196,.1);border-color:rgba(78,205,196,.2);}
.snum{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700;color:var(--cream);}
.slbl{font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.7px;margin-top:2px;}

/* DROP ZONE */
.drop-zone{
  border:1.5px dashed var(--border2);
  border-radius:16px;padding:50px 30px;text-align:center;
  cursor:pointer;transition:.2s;margin-bottom:32px;
  background:var(--s1);position:relative;
}
.drop-zone:hover,.drop-zone.drag{border-color:var(--rose);background:rgba(232,96,76,.03);}
.drop-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.dz-ico{width:52px;height:52px;border-radius:14px;background:rgba(232,96,76,.1);border:1px solid rgba(232,96,76,.2);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
.dz-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--cream);margin-bottom:6px;}
.dz-sub{font-size:13px;color:var(--muted);}

/* UPLOAD FORM */
.up-form{background:var(--s2);border:1px solid var(--border);border-radius:16px;padding:26px;margin-bottom:32px;display:none;}
.up-form.open{display:block;animation:rise .25s ease;}
.up-form h3{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;color:var(--cream);margin-bottom:18px;}
.preview-row{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px;}
.prev-img{width:120px;height:90px;object-fit:cover;border-radius:9px;border:1px solid var(--border2);flex-shrink:0;}
.prev-info{flex:1;min-width:180px;}
.prev-name{font-size:12px;color:var(--muted);margin-bottom:10px;word-break:break-all;}
.field label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px;}
.field input{width:100%;background:var(--s1);border:1px solid var(--border2);color:var(--text);padding:10px 13px;border-radius:9px;font-family:'DM Sans',sans-serif;font-size:14px;transition:.15s;}
.field input:focus{outline:none;border-color:var(--rose);box-shadow:0 0 0 3px rgba(232,96,76,.08);}
.prog{width:100%;height:3px;background:var(--border);border-radius:2px;margin-top:14px;overflow:hidden;display:none;}
.prog.show{display:block;}
.prog-fill{height:100%;background:var(--rose);width:0%;transition:width .3s;border-radius:2px;}
.up-btns{display:flex;gap:10px;margin-top:16px;}

/* GALLERY */
.gal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.gal-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:var(--cream);}
.gal-title span{color:var(--muted);font-size:14px;font-family:'DM Sans',sans-serif;font-weight:400;margin-left:8px;}
.view-toggle{display:flex;gap:6px;}
.vbtn{background:var(--s2);border:1px solid var(--border);color:var(--muted);padding:7px 12px;border-radius:7px;cursor:pointer;transition:.15s;display:flex;align-items:center;}
.vbtn.on,.vbtn:hover{border-color:var(--rose);color:var(--rose);}

/* GRID */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;transition:.3s;}
.gallery.list{grid-template-columns:1fr;}

.gcard{
  background:var(--s2);border:1px solid var(--border);
  border-radius:12px;overflow:hidden;cursor:pointer;
  transition:transform .2s,border-color .2s,box-shadow .2s;
  animation:rise .35s ease both;position:relative;
}
.gcard:hover{transform:translateY(-4px);border-color:var(--border2);box-shadow:0 12px 36px rgba(0,0,0,.5);}
.gcard img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;transition:.2s;}
.gallery.list .gcard{display:flex;align-items:center;}
.gallery.list .gcard img{width:100px;height:70px;aspect-ratio:unset;border-radius:0;flex-shrink:0;}
.gcard-body{padding:12px 14px;flex:1;}
.gcard-title{font-size:13px;font-weight:500;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gcard-date{font-size:11px;color:var(--muted);margin-top:3px;}
.gcard-del{
  position:absolute;top:8px;right:8px;
  background:rgba(12,12,14,.8);backdrop-filter:blur(4px);
  border:1px solid var(--border2);color:var(--soft);
  width:28px;height:28px;border-radius:8px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:.15s;z-index:2;
}
.gcard:hover .gcard-del{opacity:1;}
.gcard-del:hover{background:var(--rose);border-color:var(--rose);color:#fff;}
.gallery.list .gcard-del{position:static;opacity:1;margin-right:14px;flex-shrink:0;border-radius:7px;width:auto;padding:0 10px;font-size:11px;height:28px;display:flex;align-items:center;gap:5px;}

.empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--muted);}
.empty svg{margin-bottom:14px;opacity:.25;}
.empty p{font-size:14px;}

/* LIGHTBOX */
.lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:999;flex-direction:column;align-items:center;justify-content:center;}
.lb.open{display:flex;}
.lb-img{max-width:90vw;max-height:82vh;border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.7);animation:popIn .22s ease;}
.lb-cap{color:var(--muted);font-size:12px;margin-top:14px;font-weight:500;text-transform:uppercase;letter-spacing:.8px;}
.lb-close{position:fixed;top:20px;right:24px;background:var(--s3);border:1px solid var(--border2);color:var(--soft);width:40px;height:40px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;}
.lb-close:hover{border-color:var(--rose);color:var(--rose);}
.lb-nav{position:fixed;top:50%;transform:translateY(-50%);background:var(--s3);border:1px solid var(--border2);color:var(--soft);width:44px;height:44px;border-radius:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;}
.lb-nav:hover{border-color:var(--rose);color:var(--rose);}
.lb-prev{left:20px;}.lb-next{right:20px;}

.alert{padding:11px 15px;border-radius:9px;font-size:13px;font-weight:500;margin-bottom:15px;}
.a-ok{background:rgba(78,205,196,.08);color:var(--teal);border:1px solid rgba(78,205,196,.2);}
.a-er{background:rgba(232,96,76,.08);color:var(--rose);border:1px solid rgba(232,96,76,.2);}

.toast{position:fixed;bottom:28px;right:28px;z-index:400;background:var(--s3);border:1px solid var(--border2);border-radius:12px;padding:13px 18px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:9px;transform:translateY(16px) scale(.97);opacity:0;transition:.28s cubic-bezier(.34,1.56,.64,1);pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.4);}
.toast.show{transform:translateY(0) scale(1);opacity:1;}
.t-bar{width:3px;height:28px;border-radius:2px;flex-shrink:0;}
.t-ok{background:var(--teal);}.t-er{background:var(--rose);}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
@media(max-width:640px){nav{padding:0 16px;}main{padding:22px 14px;}.lb-nav{display:none;}}
</style>
</head>
<body>

<nav>
  <div class="brand">
    <div class="brand-line"></div>
    SnapVault
  </div>
  <div class="nav-right">
    <span class="nav-tag">Image Gallery</span>
    <button class="btn btn-rose" onclick="g('file-input').click()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Upload Image
    </button>
  </div>
</nav>

<main>

  <div class="stats">
    <div class="stat">
      <div class="sico">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" stroke="#e8604c" stroke-width="1.5"/><circle cx="8.5" cy="8.5" r="1.5" stroke="#e8604c" stroke-width="1.5"/><path d="M21 15l-5-5L5 21" stroke="#e8604c" stroke-width="1.5" stroke-linejoin="round"/></svg>
      </div>
      <div><div class="snum" id="s-total">—</div><div class="slbl">Total Images</div></div>
    </div>
    <div class="stat" style="animation-delay:.07s">
      <div class="sico sico2">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12" stroke="#4ecdc4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div><div class="snum" id="s-shown">—</div><div class="slbl">Showing</div></div>
    </div>
  </div>

  <!-- DROP ZONE -->
  <div class="drop-zone" id="dz" ondragover="onDrag(event,true)" ondragleave="onDrag(event,false)" ondrop="onDrop(event)">
    <input type="file" id="file-input" accept="image/*" onchange="onFileChosen(this.files[0])">
    <div class="dz-ico">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12" stroke="#e8604c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="dz-title">Drop image here or click to browse</div>
    <div class="dz-sub">JPG, PNG, GIF, WEBP — maximum 5MB</div>
  </div>

  <!-- UPLOAD FORM -->
  <div class="up-form" id="up-form">
    <h3>Upload Image</h3>
    <div id="up-msg"></div>
    <div class="preview-row">
      <img id="preview" class="prev-img" src="" alt="preview">
      <div class="prev-info">
        <div class="prev-name" id="prev-name"></div>
        <div class="field"><label>Image Title (optional)</label><input type="text" id="f-title" placeholder="Give this image a title"></div>
      </div>
    </div>
    <div class="prog" id="prog"><div class="prog-fill" id="prog-fill"></div></div>
    <div class="up-btns">
      <button class="btn btn-ghost" onclick="clearUpload()">Cancel</button>
      <button class="btn btn-rose" id="btn-up" onclick="uploadFile()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Upload
      </button>
    </div>
  </div>

  <!-- GALLERY -->
  <div class="gal-header">
    <div class="gal-title">Gallery <span id="gal-count"></span></div>
    <div class="view-toggle">
      <button class="vbtn on" id="v-grid" onclick="setView('grid')" title="Grid">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <button class="vbtn" id="v-list" onclick="setView('list')" title="List">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><line x1="8" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="8" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="8" y1="18" x2="21" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="3" y1="6" x2="3.01" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="3" y1="12" x2="3.01" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="3" y1="18" x2="3.01" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
  <div class="gallery" id="gallery"></div>

</main>

<!-- LIGHTBOX -->
<div class="lb" id="lb" onclick="lbOut(event)">
  <button class="lb-close" onclick="closeLb()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <button class="lb-nav lb-prev" onclick="lbNav(-1)">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <img class="lb-img" id="lb-img" src="" alt="">
  <div class="lb-cap" id="lb-cap"></div>
  <button class="lb-nav lb-next" onclick="lbNav(1)">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>

<div class="toast" id="toast"><div class="t-bar t-ok" id="t-bar"></div><span id="t-msg"></span></div>

<script>
var allImages=[],lbIdx=0,chosenFile=null;
function g(i){return document.getElementById(i);}
function toast(msg,err=false){g('t-msg').textContent=msg;g('t-bar').className='t-bar '+(err?'t-er':'t-ok');var t=g('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}
function setMsg(id,msg,err){g(id).innerHTML=msg?'<div class="alert '+(err?'a-er':'a-ok')+'">'+msg+'</div>':'';}

function loadStats(){
  fetch('api.php?action=stats').then(r=>r.json()).then(d=>g('s-total').textContent=d.total);
}
function loadGallery(){
  fetch('api.php?action=list').then(r=>r.json()).then(data=>{
    allImages=data;
    g('s-shown').textContent=data.length;
    g('gal-count').textContent='('+data.length+')';
    var gl=g('gallery');
    if(!data.length){
      gl.innerHTML='<div class="empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.5"/><circle cx="8.5" cy="8.5" r="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M21 15l-5-5L5 21" stroke="currentColor" stroke-width="1.5"/></svg><p>No images yet. Upload your first one.</p></div>';
      return;
    }
    var h='';
    data.forEach((img,i)=>{
      var title=img.title||img.original_name||'Untitled';
      var date=img.uploaded_at?img.uploaded_at.slice(0,10):'';
      var isGrid=!g('gallery').classList.contains('list');
      h+='<div class="gcard" onclick="openLb('+i+')">'
        +'<img src="uploads/'+img.filename+'" alt="'+title+'" loading="lazy">'
        +'<div class="gcard-body"><div class="gcard-title">'+title+'</div><div class="gcard-date">'+date+'</div></div>'
        +'<button class="gcard-del" onclick="delImg(event,'+img.id+')" title="Delete">'
        +'<svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
        +(g('gallery').classList.contains('list')?' Delete':'')+'</button>'
        +'</div>';
    });
    gl.innerHTML=h;
  });
}

function onDrag(e,over){e.preventDefault();g('dz').classList.toggle('drag',over);}
function onDrop(e){e.preventDefault();g('dz').classList.remove('drag');var f=e.dataTransfer.files[0];if(f) onFileChosen(f);}
function onFileChosen(f){
  if(!f) return;chosenFile=f;
  g('prev-name').textContent=f.name+' ('+Math.round(f.size/1024)+' KB)';
  var rd=new FileReader();rd.onload=e=>g('preview').src=e.target.result;rd.readAsDataURL(f);
  g('up-form').classList.add('open');g('up-form').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function clearUpload(){
  chosenFile=null;g('up-form').classList.remove('open');
  g('f-title').value='';g('preview').src='';g('file-input').value='';
  g('prog').classList.remove('show');g('prog-fill').style.width='0%';setMsg('up-msg','');
}
function uploadFile(){
  if(!chosenFile){toast('No file selected',true);return;}
  var btn=g('btn-up');btn.disabled=true;btn.textContent='Uploading...';
  g('prog').classList.add('show');
  var fd=new FormData();fd.append('action','upload');fd.append('file',chosenFile);fd.append('title',g('f-title').value.trim());
  var xhr=new XMLHttpRequest();xhr.open('POST','api.php');
  xhr.upload.onprogress=e=>{if(e.lengthComputable) g('prog-fill').style.width=Math.round(e.loaded/e.total*100)+'%';};
  xhr.onload=()=>{
    btn.disabled=false;
    btn.innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Upload';
    var res=JSON.parse(xhr.responseText);
    if(res.ok){toast(res.msg);clearUpload();loadGallery();loadStats();}
    else{setMsg('up-msg',res.msg,true);g('prog').classList.remove('show');}
  };
  xhr.send(fd);
}
function delImg(e,id){
  e.stopPropagation();
  if(!confirm('Delete this image?')) return;
  var fd=new FormData();fd.append('action','delete');fd.append('id',id);
  fetch('api.php',{method:'POST',body:fd}).then(r=>r.json()).then(res=>{toast(res.msg,!res.ok);loadGallery();loadStats();});
}
function openLb(i){lbIdx=i;showLb();g('lb').classList.add('open');}
function showLb(){
  var img=allImages[lbIdx];if(!img) return;
  var i=g('lb-img');i.style.opacity='0';
  setTimeout(()=>{i.src='uploads/'+img.filename;i.style.opacity='1';i.style.transition='opacity .18s';},80);
  g('lb-cap').textContent=(img.title||img.original_name||'')+'  —  '+(img.uploaded_at||'').slice(0,10);
}
function closeLb(){g('lb').classList.remove('open');}
function lbOut(e){if(e.target===g('lb')) closeLb();}
function lbNav(dir){lbIdx=(lbIdx+dir+allImages.length)%allImages.length;showLb();}
function setView(v){
  var gl=g('gallery');
  gl.classList.toggle('list',v==='list');
  g('v-grid').classList.toggle('on',v==='grid');
  g('v-list').classList.toggle('on',v==='list');
  loadGallery();
}
document.addEventListener('keydown',e=>{
  if(!g('lb').classList.contains('open')) return;
  if(e.key==='Escape') closeLb();
  if(e.key==='ArrowRight') lbNav(1);

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudTrack — CRUD System</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6fa;
  --white:#ffffff;
  --s1:#f0f1f7;
  --navy:#0f172a;
  --navy2:#1e293b;
  --border:#e2e6f0;
  --border2:#cbd2e0;
  --text:#0f172a;
  --muted:#64748b;
  --soft:#94a3b8;
  --accent:#3b5bdb;
  --accent2:#4c6ef5;
  --green:#16a34a;
  --red:#dc2626;
  --amber:#d97706;
  --purple:#7c3aed;
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

nav{
  background:var(--navy);
  padding:0 40px;height:64px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50;
}
.brand{
  font-family:'Syne',sans-serif;font-size:20px;font-weight:800;
  color:#fff;display:flex;align-items:center;gap:10px;letter-spacing:-.3px;
}
.brand-dot{width:8px;height:8px;background:var(--accent2);border-radius:50%;}
.nav-right{display:flex;align-items:center;gap:10px;}
.nav-lbl{color:rgba(255,255,255,.4);font-size:12px;font-weight:500;}

.btn{
  display:inline-flex;align-items:center;gap:7px;
  border:none;border-radius:8px;padding:10px 18px;
  font-family:'Inter',sans-serif;font-size:13px;font-weight:600;
  cursor:pointer;transition:all .15s;text-decoration:none;white-space:nowrap;
}
.btn-accent{background:var(--accent);color:#fff;}
.btn-accent:hover{background:var(--accent2);transform:translateY(-1px);}
.btn-ghost{background:transparent;border:1.5px solid var(--border2);color:var(--muted);}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn-danger{background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.2);color:var(--red);}
.btn-danger:hover{background:rgba(220,38,38,.14);}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:7px;}

main{max-width:1160px;margin:0 auto;padding:36px 24px;}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:32px;}
.stat{
  background:var(--white);border:1px solid var(--border);
  border-radius:var(--r);padding:22px;
  animation:fadeUp .45s ease both;
}
.stat:nth-child(2){animation-delay:.07s}
.stat:nth-child(3){animation-delay:.14s}
.stat:nth-child(4){animation-delay:.21s}
.stat-ico{
  width:38px;height:38px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:14px;
}
.ic-a{background:#eff2ff;}.ic-b{background:#f0fdf4;}.ic-c{background:#fffbeb;}.ic-d{background:#faf5ff;}
.stat-num{font-family:'Syne',sans-serif;font-size:26px;font-weight:700;color:var(--navy);}
.stat-lbl{font-size:11px;font-weight:600;color:var(--soft);text-transform:uppercase;letter-spacing:.7px;margin-top:3px;}

.toolbar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
.search-box{position:relative;flex:1;min-width:200px;}
.search-box input{
  width:100%;padding:10px 14px 10px 38px;
  border:1.5px solid var(--border);border-radius:9px;
  background:var(--white);color:var(--text);
  font-family:'Inter',sans-serif;font-size:14px;transition:.15s;
}
.search-box input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,91,219,.08);}
.search-box .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--soft);}
select{
  background:var(--white);border:1.5px solid var(--border);color:var(--text);
  padding:10px 14px;border-radius:9px;
  font-family:'Inter',sans-serif;font-size:13px;cursor:pointer;transition:.15s;
}
select:focus{outline:none;border-color:var(--accent);}

.table-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.table-head-row{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);}
.table-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;}
.table-title span{color:var(--soft);font-size:13px;font-family:'Inter',sans-serif;font-weight:400;margin-left:6px;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{
  background:var(--s1);color:var(--muted);
  padding:11px 18px;text-align:left;
  font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;
  border-bottom:1px solid var(--border);
}
tbody td{padding:14px 18px;border-bottom:1px solid var(--border);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:rgba(59,91,219,.025);}

.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
.p-accent{background:#eff2ff;color:var(--accent);}
.p-green{background:#f0fdf4;color:var(--green);}
.p-red{background:#fef2f2;color:var(--red);}
.p-amber{background:#fffbeb;color:var(--amber);}
.p-purple{background:#faf5ff;color:var(--purple);}

.gpa-bar{display:inline-block;width:60px;height:5px;background:var(--border);border-radius:3px;vertical-align:middle;margin-left:8px;overflow:hidden;}
.gpa-fill{height:100%;border-radius:3px;}

.empty{padding:60px;text-align:center;color:var(--soft);}
.empty svg{margin-bottom:12px;opacity:.35;}
.empty p{font-size:14px;}

.overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;padding:20px;}
.overlay.open{display:flex;}
.modal{
  background:var(--white);border:1px solid var(--border2);
  border-radius:16px;padding:34px;width:100%;max-width:500px;
  animation:popIn .22s cubic-bezier(.34,1.56,.64,1);position:relative;
  box-shadow:0 20px 60px rgba(15,23,42,.15);
}
.modal-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;margin-bottom:22px;color:var(--navy);}
.modal-close{
  position:absolute;top:16px;right:16px;
  background:var(--s1);border:1px solid var(--border);
  color:var(--muted);width:30px;height:30px;border-radius:7px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;
}
.modal-close:hover{color:var(--text);border-color:var(--border2);}

.field{margin-bottom:15px;}
.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;}
.field input,.field select{
  width:100%;background:var(--bg);border:1.5px solid var(--border);
  color:var(--text);padding:10px 13px;border-radius:9px;
  font-family:'Inter',sans-serif;font-size:14px;transition:.15s;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);background:var(--white);box-shadow:0 0 0 3px rgba(59,91,219,.07);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
.modal-foot{display:flex;gap:10px;margin-top:8px;}

.alert{padding:11px 15px;border-radius:9px;font-size:13px;font-weight:500;margin-bottom:15px;}
.a-ok{background:#f0fdf4;color:var(--green);border:1px solid #bbf7d0;}
.a-er{background:#fef2f2;color:var(--red);border:1px solid #fecaca;}

.toast{
  position:fixed;bottom:28px;right:28px;z-index:400;
  background:var(--navy);color:#fff;
  border-radius:12px;padding:13px 18px;font-size:13px;font-weight:500;
  display:flex;align-items:center;gap:9px;
  transform:translateY(16px) scale(.97);opacity:0;
  transition:.28s cubic-bezier(.34,1.56,.64,1);pointer-events:none;
  box-shadow:0 8px 30px rgba(15,23,42,.25);
}
.toast.show{transform:translateY(0) scale(1);opacity:1;}
.t-bar{width:3px;height:28px;border-radius:2px;flex-shrink:0;}
.t-ok{background:var(--green);}.t-er{background:var(--red);}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:scale(1)}}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
@media(max-width:700px){nav{padding:0 18px;}main{padding:22px 14px;}.row2{grid-template-columns:1fr;}}
</style>
</head>
<body>

<nav>
  <div class="brand">
    <div class="brand-dot"></div>
    StudTrack
  </div>
  <div class="nav-right">
    <span class="nav-lbl">CRUD with MySQL</span>
    <button class="btn btn-accent" onclick="openAdd()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
      Add Student
    </button>
  </div>
</nav>

<main>
  <div class="stats">
    <div class="stat">
      <div class="stat-ico ic-a">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" stroke="#3b5bdb" stroke-width="1.8"/><circle cx="9" cy="7" r="4" stroke="#3b5bdb" stroke-width="1.8"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" stroke="#3b5bdb" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div>
      <div class="stat-num" id="s-total">—</div>
      <div class="stat-lbl">Total Students</div>
    </div>
    <div class="stat">
      <div class="stat-ico ic-b">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 19.5A2.5 2.5 0 016.5 17H20" stroke="#16a34a" stroke-width="1.8"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z" stroke="#16a34a" stroke-width="1.8"/></svg>
      </div>
      <div class="stat-num" id="s-cors">—</div>
      <div class="stat-lbl">Courses</div>
    </div>
    <div class="stat">
      <div class="stat-ico ic-c">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" stroke="#d97706" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </div>
      <div class="stat-num" id="s-gpa">—</div>
      <div class="stat-lbl">Average GPA</div>
    </div>
    <div class="stat">
      <div class="stat-ico ic-d">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M8.21 13.89L7 23l5-3 5 3-1.21-9.12" stroke="#7c3aed" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 2a4 4 0 100 8 4 4 0 000-8z" stroke="#7c3aed" stroke-width="1.8"/></svg>
      </div>
      <div class="stat-num" id="s-top" style="font-size:15px;font-family:'Inter',sans-serif;font-weight:600;">—</div>
      <div class="stat-lbl">Top Student</div>
    </div>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <span class="ico">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </span>
      <input type="text" id="search" placeholder="Search by name or email..." oninput="loadStudents()">
    </div>
    <select id="cf" onchange="loadStudents()"><option value="">All Courses</option></select>
  </div>

  <div class="table-card">
    <div class="table-head-row">
      <div class="table-title">Student Records <span id="count-lbl"></span></div>
    </div>
    <table>
      <thead><tr><th>#</th><th>Full Name</th><th>Email</th><th>Course</th><th>Year</th><th>GPA</th><th>Actions</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</main>

<!-- FORM MODAL -->
<div class="overlay" id="ov-form" onclick="bgClose(event,'ov-form')">
  <div class="modal">
    <button class="modal-close" onclick="close2('ov-form')">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="modal-title" id="form-title">Add Student</div>
    <div id="form-msg"></div>
    <input type="hidden" id="f-id">
    <div class="field"><label>Full Name</label><input id="f-name" type="text" placeholder="e.g. Alice Uwimana"></div>
    <div class="field"><label>Email Address</label><input id="f-email" type="email" placeholder="student@email.com"></div>
    <div class="field"><label>Course / Program</label><input id="f-course" type="text" placeholder="e.g. Computer Science"></div>
    <div class="row2">
      <div class="field"><label>Academic Year</label>
        <select id="f-year"><option value="1">Year 1</option><option value="2">Year 2</option><option value="3">Year 3</option><option value="4">Year 4</option></select>
      </div>
      <div class="field"><label>GPA (0.0 – 4.0)</label><input id="f-gpa" type="number" placeholder="3.50" min="0" max="4" step="0.01"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="close2('ov-form')">Cancel</button>
      <button class="btn btn-accent" style="flex:1" onclick="saveStudent()">Save Record</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><div class="t-bar t-ok" id="t-bar"></div><span id="t-msg"></span></div>

<script>
function g(i){return document.getElementById(i);}
function bgClose(e,id){if(e.target===g(id))close2(id);}
function close2(id){g(id).classList.remove('open');}
function open2(id){g(id).classList.add('open');}
function setMsg(id,msg,err){g(id).innerHTML=msg?'<div class="alert '+(err?'a-er':'a-ok')+'">'+msg+'</div>':'';}
function toast(msg,err=false){
  g('t-msg').textContent=msg;g('t-bar').className='t-bar '+(err?'t-er':'t-ok');
  var t=g('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);
}

function loadStats(){
  fetch('api.php?action=stats').then(r=>r.json()).then(d=>{
    g('s-total').textContent=d.total;g('s-cors').textContent=d.cors;
    g('s-gpa').textContent=d.avg||'—';g('s-top').textContent=d.top;
  });
}
function loadCourses(){
  fetch('api.php?action=courses').then(r=>r.json()).then(list=>{
    var s=g('cf');s.innerHTML='<option value="">All Courses</option>';
    list.forEach(c=>s.innerHTML+='<option value="'+c+'">'+c+'</option>');
  });
}
function loadStudents(){
  var q=g('search').value,c=g('cf').value;
  fetch('api.php?action=list&search='+encodeURIComponent(q)+'&course='+encodeURIComponent(c))
    .then(r=>r.json()).then(rows=>{
      g('count-lbl').textContent='('+rows.length+')';
      var tb=g('tbody');
      if(!rows.length){
        tb.innerHTML='<tr><td colspan="7"><div class="empty"><svg width="36" height="36" viewBox="0 0 24 24" fill="none"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="1.5"/><circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="1.5"/></svg><p>No students found.</p></div></td></tr>';
        return;
      }
      var h='';
      rows.forEach((r,i)=>{
        var gpa=parseFloat(r.gpa),pct=Math.round(gpa/4*100);
        var gc=gpa>=3.5?'#16a34a':gpa>=2.5?'#3b5bdb':'#dc2626';
        var gpcls=gpa>=3.5?'p-green':gpa>=2.5?'p-accent':'p-red';
        h+='<tr><td style="color:var(--soft);font-size:12px">'+(i+1)+'</td>'
          +'<td style="font-weight:600">'+r.full_name+'</td>'
          +'<td style="color:var(--muted)">'+r.email+'</td>'
          +'<td><span class="pill p-purple">'+r.course+'</span></td>'
          +'<td style="color:var(--muted)">Yr '+r.year+'</td>'
          +'<td><span class="pill '+gpcls+'">'+gpa.toFixed(2)+'</span>'
          +'<span class="gpa-bar"><span class="gpa-fill" style="width:'+pct+'%;background:'+gc+'"></span></span></td>'
          +'<td style="display:flex;gap:6px;flex-wrap:wrap">'
          +'<button class="btn btn-ghost btn-sm" onclick="openEdit('+r.id+')">'
          +'<svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> Edit</button>'
          +'<button class="btn btn-danger btn-sm" onclick="delStudent('+r.id+',\''+r.full_name+'\')">'
          +'<svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> Delete</button>'
          +'</td></tr>';
      });
      tb.innerHTML=h;
    });
}

function openAdd(){
  g('form-title').textContent='Add Student';setMsg('form-msg','');
  g('f-id').value='';
  ['f-name','f-email','f-course','f-gpa'].forEach(id=>g(id).value='');
  g('f-year').value='1';open2('ov-form');setTimeout(()=>g('f-name').focus(),100);
}
function openEdit(id){
  fetch('api.php?action=get&id='+id).then(r=>r.json()).then(d=>{
    g('form-title').textContent='Edit Student';setMsg('form-msg','');
    g('f-id').value=d.id;g('f-name').value=d.full_name;g('f-email').value=d.email;
    g('f-course').value=d.course;g('f-year').value=d.year;g('f-gpa').value=d.gpa;
    open2('ov-form');
  });
}
function saveStudent(){
  var id=g('f-id').value;
  var fd=new FormData();
  fd.append('action',id?'edit':'add');if(id) fd.append('id',id);
  fd.append('full_name',g('f-name').value.trim());fd.append('email',g('f-email').value.trim());
  fd.append('course',g('f-course').value.trim());fd.append('year',g('f-year').value);
  fd.append('gpa',g('f-gpa').value||0);
  fetch('api.php',{method:'POST',body:fd}).then(r=>r.json()).then(res=>{
    setMsg('form-msg',res.msg,!res.ok);
    if(res.ok){toast(res.msg);setTimeout(()=>{close2('ov-form');loadStudents();loadStats();loadCourses();},600);}
  });
}
function delStudent(id,name){
  if(!confirm('Delete record of "'+name+'"?')) return;
  var fd=new FormData();fd.append('action','delete');fd.append('id',id);
  fetch('api.php',{method:'POST',body:fd}).then(r=>r.json()).then(res=>{
    toast(res.msg,!res.ok);loadStudents();loadStats();loadCourses();
  });
}

document.addEventListener('keydown',e=>{if(e.key==='Escape') close2('ov-form');});
loadStats();loadCourses();loadStudents();
</script>
</body>
</html>
